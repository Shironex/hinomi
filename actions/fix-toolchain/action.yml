name: Hinomi fix toolchain
description: Sets up every package manager the fix runner's detect step named, for the apply and majors jobs of the Hinomi fix workflow.
author: Shironex

# Takes the detect step's outputs as inputs. Every package manager among the dispatch's
# projects is set up, so a repo with a pnpm app and a Rust crate gets both. Caches stay off: a
# save from these jobs would publish files dependency code could have touched.

inputs:
  setup_node:
    description: detect output setup_node
    required: true
  node_version_file:
    description: detect output node_version_file
    required: false
    default: ''
  setup_pnpm:
    description: detect output setup_pnpm
    required: true
  pnpm_version:
    description: detect output pnpm_version
    required: false
    default: ''
  pnpm_package_json:
    description: detect output pnpm_package_json
    required: false
    default: ''
  setup_yarn:
    description: detect output setup_yarn
    required: true
  yarn_version:
    description: detect output yarn_version
    required: false
    default: ''
  setup_bun:
    description: detect output setup_bun
    required: true
  bun_version:
    description: detect output bun_version
    required: false
    default: ''
  setup_rust:
    description: detect output setup_rust
    required: true
  rust_root:
    description: detect output rust_root
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Node
      if: inputs.setup_node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.node_version_file != '' && inputs.node_version_file || '' }}
        node-version: ${{ inputs.node_version_file == '' && 'lts/*' || '' }}
        package-manager-cache: false

    - name: Set up pnpm
      if: inputs.setup_pnpm == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ inputs.pnpm_version }}
        package_json_file: ${{ inputs.pnpm_package_json }}

    # yarn without corepack (no longer bundled with current Node majors): the version the
    # packageManager field names, installed with npm at that exact version and without
    # scripts, yarn 2 and later from @yarnpkg/cli-dist. Without a field, the yarn classic on
    # the runner image, which follows a yarnPath in .yarnrc.yml.
    - name: Set up yarn
      if: inputs.setup_yarn == 'true'
      shell: bash
      env:
        YARN_VERSION: ${{ inputs.yarn_version }}
      run: |
        if [ -n "$YARN_VERSION" ]; then
          if ! [[ "$YARN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::packageManager names yarn $YARN_VERSION, not an exact version"
            exit 1
          fi
          if [ "${YARN_VERSION%%.*}" = 1 ]; then
            npm install --global --ignore-scripts "yarn@$YARN_VERSION"
          else
            npm install --global --ignore-scripts "@yarnpkg/cli-dist@$YARN_VERSION"
          fi
        fi
        yarn --version

    - name: Set up bun
      if: inputs.setup_bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun_version }}
        no-cache: true

    - name: Set up Rust
      if: inputs.setup_rust == 'true'
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable

    # A rust-toolchain file in the crate's folder or above overrides stable; install it now
    # so later cargo calls do not download it halfway.
    - name: Install the repo's pinned Rust toolchain
      if: inputs.setup_rust == 'true'
      shell: bash
      env:
        RUST_ROOT: ${{ inputs.rust_root }}
      run: |
        dir="$GITHUB_WORKSPACE/$RUST_ROOT"
        while :; do
          if [ -f "$dir/rust-toolchain.toml" ] || [ -f "$dir/rust-toolchain" ]; then
            (cd "$GITHUB_WORKSPACE/$RUST_ROOT" && rustup toolchain install --no-self-update)
            break
          fi
          if [ "$dir" = "$GITHUB_WORKSPACE" ]; then break; fi
          dir=$(dirname "$dir")
        done
        (cd "$GITHUB_WORKSPACE/$RUST_ROOT" && cargo --version)
