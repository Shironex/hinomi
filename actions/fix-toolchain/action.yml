name: Hinomi fix toolchain
description: Sets up every package manager the fix runner's detect step named, for the apply and majors jobs of the Hinomi fix workflow.
author: Shironex

# Takes the detect step's outputs as inputs. Every package manager among the dispatch's
# projects is set up, so a repo with a pnpm app and a Rust crate gets both. Caches stay off: a
# save from these jobs would publish files dependency code could have touched.

inputs:
  setup_node:
    description: detect output setup_node
    required: true
  node_version_file:
    description: detect output node_version_file
    required: false
    default: ''
  setup_pnpm:
    description: detect output setup_pnpm
    required: true
  pnpm_version:
    description: detect output pnpm_version
    required: false
    default: ''
  pnpm_package_json:
    description: detect output pnpm_package_json
    required: false
    default: ''
  setup_yarn:
    description: detect output setup_yarn
    required: true
  yarn_version:
    description: detect output yarn_version
    required: false
    default: ''
  setup_bun:
    description: detect output setup_bun
    required: true
  bun_version:
    description: detect output bun_version
    required: false
    default: ''
  setup_rust:
    description: detect output setup_rust
    required: true
  rust_root:
    description: detect output rust_root
    required: false
    default: ''
  # Optional, so a fix.yml from before these ecosystems still calls this action unchanged.
  setup_go:
    description: detect output setup_go
    required: false
    default: 'false'
  go_version_file:
    description: detect output go_version_file
    required: false
    default: ''
  setup_uv:
    description: detect output setup_uv
    required: false
    default: 'false'
  uv_version:
    description: detect output uv_version
    required: false
    default: ''
  setup_php:
    description: detect output setup_php
    required: false
    default: 'false'
  php_version:
    description: detect output php_version
    required: false
    default: ''
  composer_version:
    description: detect output composer_version
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Node
      if: inputs.setup_node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.node_version_file != '' && inputs.node_version_file || '' }}
        node-version: ${{ inputs.node_version_file == '' && 'lts/*' || '' }}
        package-manager-cache: false

    - name: Set up pnpm
      if: inputs.setup_pnpm == 'true'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: ${{ inputs.pnpm_version }}
        package_json_file: ${{ inputs.pnpm_package_json }}

    # yarn without corepack (no longer bundled with current Node majors): the version the
    # packageManager field names, installed with npm at that exact version and without
    # scripts, yarn 2 and later from @yarnpkg/cli-dist. Without a field, the yarn classic on
    # the runner image, which follows a yarnPath in .yarnrc.yml.
    - name: Set up yarn
      if: inputs.setup_yarn == 'true'
      shell: bash
      env:
        YARN_VERSION: ${{ inputs.yarn_version }}
      run: |
        if [ -n "$YARN_VERSION" ]; then
          if ! [[ "$YARN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::packageManager names yarn $YARN_VERSION, not an exact version"
            exit 1
          fi
          if [ "${YARN_VERSION%%.*}" = 1 ]; then
            npm install --global --ignore-scripts "yarn@$YARN_VERSION"
          else
            npm install --global --ignore-scripts "@yarnpkg/cli-dist@$YARN_VERSION"
          fi
        fi
        yarn --version

    - name: Set up bun
      if: inputs.setup_bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun_version }}
        no-cache: true

    - name: Set up Rust
      if: inputs.setup_rust == 'true'
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable

    # A rust-toolchain file in the crate's folder or above overrides stable; install it now
    # so later cargo calls do not download it halfway.
    - name: Install the repo's pinned Rust toolchain
      if: inputs.setup_rust == 'true'
      shell: bash
      env:
        RUST_ROOT: ${{ inputs.rust_root }}
      run: |
        dir="$GITHUB_WORKSPACE/$RUST_ROOT"
        while :; do
          if [ -f "$dir/rust-toolchain.toml" ] || [ -f "$dir/rust-toolchain" ]; then
            (cd "$GITHUB_WORKSPACE/$RUST_ROOT" && rustup toolchain install --no-self-update)
            break
          fi
          if [ "$dir" = "$GITHUB_WORKSPACE" ]; then break; fi
          dir=$(dirname "$dir")
        done
        (cd "$GITHUB_WORKSPACE/$RUST_ROOT" && cargo --version)

    # Go from the project's go.mod (its go and toolchain lines). The fix runner runs every go
    # command with GOTOOLCHAIN=local, so nothing downloads another toolchain after this step.
    - name: Set up Go
      if: inputs.setup_go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ inputs.go_version_file }}
        cache: false

    # uv at the version the detect step pins. The fix runner only calls `uv lock --no-build`,
    # which builds no source distribution.
    - name: Set up uv
      if: inputs.setup_uv == 'true'
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: ${{ inputs.uv_version }}
        enable-cache: false

    # PHP for composer at the version composer.json names, with composer at an exact version.
    # The fix runner calls composer with --no-scripts and --no-plugins only. github-token is
    # empty on purpose: by default setup-php writes the job's GITHUB_TOKEN into composer's
    # global auth.json, where every later process (package managers, checks) could read it.
    - name: Set up PHP and composer
      if: inputs.setup_php == 'true'
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ inputs.php_version }}
        tools: composer:${{ inputs.composer_version }}
        coverage: none
        github-token: ''

    # The empty github-token above is not enough: setup-php 2.40.0 still writes the job token
    # into the global auth.json (seen in CI), so it is removed before anything else runs.
    - name: Remove the GitHub token from composer
      if: inputs.setup_php == 'true'
      shell: bash
      run: |
        composer config --global --unset github-oauth.github.com --no-plugins --no-interaction || true
        if [ -n "${COMPOSER_AUTH:-}" ]; then echo "COMPOSER_AUTH=" >> "$GITHUB_ENV"; fi

    - name: Check composer holds no GitHub token
      if: inputs.setup_php == 'true'
      shell: bash
      run: |
        home=$(composer config --global home --no-plugins --no-interaction 2>/dev/null || true)
        for file in "$home/auth.json" "$HOME/.composer/auth.json" "$HOME/.config/composer/auth.json"; do
          if [ -f "$file" ] && grep -qE '"github\.com" *: *"[^"]+"|gh[pousr]_|github_pat_' "$file"; then
            echo "::error::$file holds a GitHub token that every later process could read"
            exit 1
          fi
        done
        if composer config --global github-oauth.github.com --no-plugins --no-interaction >/dev/null 2>&1; then
          echo "::error::composer still has a github-oauth token for github.com"
          exit 1
        fi
        if [ -n "${COMPOSER_AUTH:-}" ]; then
          echo "::error::COMPOSER_AUTH is set for every later step"
          exit 1
        fi
        echo "composer has no GitHub token"
