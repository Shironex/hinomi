name: Hinomi fix runner
description: Applies a Hinomi fix plan to the checkout and writes a patch plus hinomi-result.json. Meant for the read only apply job of the Hinomi fix workflow.
author: Shironex

inputs:
  step:
    description: 'detect (validate the dispatch and name every toolchain, before they are set up), apply, check (the full install and checks after apply with defer_checks), agent (run the majors coding agent and capture its patch) or publish (verify the patch and push the branch)'
    required: false
    default: apply
  scope:
    description: 'fix (the safe steps, hinomi/fix-plan) or majors (the agent job, hinomi/majors); used by detect and publish'
    required: false
    default: fix
  plan:
    description: The dispatch from Hinomi, JSON or gzip plus base64. Not used by publish.
    required: false
    default: ''
  encoding:
    description: json or gzip-base64
    required: false
    default: json
  run_id:
    description: Hinomi's fix run id; when set it must match the dispatch.
    required: false
    default: ''
  checks:
    description: 'auto (the dispatch decides), install, full, or a comma list such as lint,test'
    required: false
    default: auto
  defer_checks:
    description: 'apply: true leaves the full install and the checks to the check step, so the patch is final before any install script runs'
    required: false
    default: 'false'
  artifact_dir:
    description: 'publish: folder with the downloaded hinomi-result.json and fix.patch'
    required: false
    default: .hinomi
  base_sha:
    description: "publish: the apply step's base_sha output"
    required: false
    default: ''
  patch_sha256:
    description: "publish: the apply step's patch_sha256 output; the patch must hash to it"
    required: false
    default: ''
  patch_files:
    description: "publish: the apply step's patch_files output; the patch must touch exactly these"
    required: false
    default: '[]'
  agent_secret:
    description: 'agent: the API key of the coding agent preset, passed to the agent process only'
    required: false
    default: ''
  dry_run:
    description: 'publish: true verifies, applies and commits but pushes nothing. agent: allows the stub preset'
    required: false
    default: 'false'
  token:
    description: 'publish: token with contents write, used only for the push'
    required: false
    default: ''

outputs:
  package_manager:
    description: Package manager of the first project (detect and apply).
  package_manager_version:
    description: Version from the packageManager field, empty when it has none (detect).
  lockfile:
    description: Lockfile of the first project (detect).
  project_root:
    description: Folder of the first project's lockfile (detect).
  package_managers:
    description: Every package manager among the dispatch's projects, comma separated (detect).
  setup_node:
    description: true when a project uses npm, pnpm, yarn or bun (detect).
  node_version_file:
    description: File setup-node reads the Node version from, empty for the current LTS (detect).
  setup_pnpm:
    description: true when a project uses pnpm (detect).
  pnpm_version:
    description: pnpm version to install, empty when pnpm_package_json names it (detect).
  pnpm_package_json:
    description: package.json pnpm/action-setup reads (detect).
  setup_yarn:
    description: true when a project uses yarn (detect).
  yarn_version:
    description: yarn version from the packageManager field, empty to use the runner image's yarn (detect).
  setup_bun:
    description: true when a project uses bun (detect).
  bun_version:
    description: bun version to install (detect).
  setup_rust:
    description: true when a project uses cargo (detect).
  rust_root:
    description: Folder of the first cargo project, where a rust-toolchain file applies (detect).
  artifact_name:
    description: Name for the uploaded artifact, hinomi-<scope>-<run id> from the validated dispatch (detect).
  has_steps:
    description: true when the dispatch carries safe steps for the apply step (detect).
  base_sha:
    description: The commit the steps were applied to (apply, agent).
  patch_sha256:
    description: SHA-256 of fix.patch, empty without a patch (apply, agent).
  patch_files:
    description: JSON list of the files in fix.patch (apply, agent).
  branch:
    description: The fix branch (publish).
  commit_sha:
    description: The fix commit (publish).
  pushed:
    description: false in a dry run (publish).
  has_changes:
    description: true when the apply or agent step produced a patch.
  agent_needed:
    description: true when the dispatch asks for the optional majors job and carries risky steps.
  output_dir:
    description: Folder with hinomi-result.json and fix.patch, to upload as one artifact.
  result_path:
    description: Path of hinomi-result.json.
  patch_path:
    description: Path of fix.patch, empty when there is no patch.
  rejected:
    description: true when the dispatch or the checkout was refused before anything was applied.

runs:
  using: node24
  main: dist/index.mjs
