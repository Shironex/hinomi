name: Hinomi fix runner
description: Applies a Hinomi fix plan to the checkout and writes a patch plus hinomi-result.json. Meant for the read only apply job of the Hinomi fix workflow.
author: Shironex

inputs:
  step:
    description: 'detect (validate the dispatch and name every toolchain, before they are set up) or apply'
    required: false
    default: apply
  plan:
    description: The dispatch from Hinomi, JSON or gzip plus base64.
    required: true
  encoding:
    description: json or gzip-base64
    required: false
    default: json
  run_id:
    description: Hinomi's fix run id; when set it must match the dispatch.
    required: false
    default: ''
  checks:
    description: 'auto (the dispatch decides), install, full, or a comma list such as lint,test'
    required: false
    default: auto

outputs:
  package_manager:
    description: Package manager of the first project (detect and apply).
  package_manager_version:
    description: Version from the packageManager field, empty when it has none (detect).
  lockfile:
    description: Lockfile of the first project (detect).
  project_root:
    description: Folder of the first project's lockfile (detect).
  package_managers:
    description: Every package manager among the dispatch's projects, comma separated (detect).
  setup_node:
    description: true when a project uses npm, pnpm, yarn or bun (detect).
  node_version_file:
    description: File setup-node reads the Node version from, empty for the current LTS (detect).
  setup_pnpm:
    description: true when a project uses pnpm (detect).
  pnpm_version:
    description: pnpm version to install, empty when pnpm_package_json names it (detect).
  pnpm_package_json:
    description: package.json pnpm/action-setup reads (detect).
  setup_yarn:
    description: true when a project uses yarn (detect).
  yarn_version:
    description: yarn version from the packageManager field, empty to use the runner image's yarn (detect).
  setup_bun:
    description: true when a project uses bun (detect).
  bun_version:
    description: bun version to install (detect).
  setup_rust:
    description: true when a project uses cargo (detect).
  rust_root:
    description: Folder of the first cargo project, where a rust-toolchain file applies (detect).
  artifact_name:
    description: Name for the uploaded artifact, from the validated dispatch run id (detect).
  has_changes:
    description: true when the apply step produced a patch.
  agent_needed:
    description: true when the dispatch asks for the optional majors job and carries risky steps.
  output_dir:
    description: Folder with hinomi-result.json and fix.patch, to upload as one artifact.
  result_path:
    description: Path of hinomi-result.json.
  patch_path:
    description: Path of fix.patch, empty when there is no patch.
  rejected:
    description: true when the dispatch or the checkout was refused before anything was applied.

runs:
  using: node24
  main: dist/index.mjs
