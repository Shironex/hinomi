name: Hinomi fix (reusable)

# Called by the hinomi-fix.yml caller each target repo adds (docs/runner/hinomi-fix.yml), pinned
# to a commit of this file. The caller sets `run-name: hinomi fix <run_id>`; a called workflow
# cannot name the run itself.
#
# Trust split (docs/design/fix-runner.md, section 7):
# - apply: read only token, no secrets. Edits manifests and updates lockfiles without running
#   any install script, reports the patch hash as a job output, then runs the full install and
#   the repo's checks in a later step. Dependency code only ever runs after the hash is set.
# - publish: contents write, runs no repo or dependency code. Verifies the patch against the
#   apply job's outputs and the dependency file allowlist, commits it on the base commit and
#   force pushes hinomi/fix-plan. Hinomi opens the PR.
# - majors (optional, a separate dispatch whose plan carries only major upgrades): read only
#   token plus the caller's ANTHROPIC_API_KEY. Runs a coding agent on the checkout, captures
#   its patch and reports the hash as a job output. Off unless the repo turns it on in Hinomi.
# - majors-publish: contents write, runs no repo, dependency or agent code. Verifies the patch
#   against the majors job's outputs and the wider majors allowlist (never .github), then
#   force pushes hinomi/majors. Hinomi opens the PR, always as a draft.
#
# The action comes from this repo at the commit of this workflow (`$/`, the self repository
# reference), so a caller's pin covers the workflow and the action together, and the action's
# code never sits in the checkout the repo's lint and tests see. Nothing saves a cache.

on:
  workflow_call:
    inputs:
      run_id:
        description: Hinomi run id
        type: string
        required: true
      plan:
        description: Fix plan from Hinomi (JSON, or gzip plus base64)
        type: string
        required: true
      encoding:
        description: json or gzip-base64
        type: string
        default: json
      checks:
        description: auto (the dispatch decides), install, full, or a comma list such as lint,test
        type: string
        default: auto
      dry_run:
        description: Verify, apply and commit the patch in the publish job, but push nothing
        type: boolean
        default: false
    secrets:
      ANTHROPIC_API_KEY:
        description: Key for the optional majors agent (Claude Code); only the majors job reads it
        required: false
    outputs:
      has_changes:
        description: true when the plan produced a patch
        value: ${{ jobs.apply.outputs.has_changes }}
      patch_sha256:
        description: SHA-256 of the patch
        value: ${{ jobs.apply.outputs.patch_sha256 }}
      branch:
        description: The fix branch, when publish ran
        value: ${{ jobs.publish.outputs.branch }}
      pushed:
        description: true when publish pushed the branch
        value: ${{ jobs.publish.outputs.pushed }}
      majors_has_changes:
        description: true when the majors agent left a patch
        value: ${{ jobs.majors.outputs.has_changes }}
      majors_patch_sha256:
        description: SHA-256 of the majors patch
        value: ${{ jobs.majors.outputs.patch_sha256 }}
      majors_branch:
        description: The majors branch, when majors-publish ran
        value: ${{ jobs.majors-publish.outputs.branch }}
      majors_pushed:
        description: true when majors-publish pushed the branch
        value: ${{ jobs.majors-publish.outputs.pushed }}

permissions: {}

# One fix run per repo at a time; a second dispatch waits instead of racing on the branch.
concurrency:
  group: hinomi-fix-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply the plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.apply.outputs.has_changes }}
      agent_needed: ${{ steps.detect.outputs.agent_needed }}
      base_sha: ${{ steps.apply.outputs.base_sha }}
      patch_sha256: ${{ steps.apply.outputs.patch_sha256 }}
      patch_files: ${{ steps.apply.outputs.patch_files }}
      artifact_name: ${{ steps.detect.outputs.artifact_name }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the plan and detect the toolchains
        id: detect
        uses: $/actions/fix-runner
        with:
          step: detect
          plan: ${{ inputs.plan }}
          encoding: ${{ inputs.encoding }}
          run_id: ${{ inputs.run_id }}

      # Every package manager among the plan's projects (actions/fix-toolchain, no caches).
      - name: Set up the toolchains
        uses: $/actions/fix-toolchain
        with:
          setup_node: ${{ steps.detect.outputs.setup_node }}
          node_version_file: ${{ steps.detect.outputs.node_version_file }}
          setup_pnpm: ${{ steps.detect.outputs.setup_pnpm }}
          pnpm_version: ${{ steps.detect.outputs.pnpm_version }}
          pnpm_package_json: ${{ steps.detect.outputs.pnpm_package_json }}
          setup_yarn: ${{ steps.detect.outputs.setup_yarn }}
          yarn_version: ${{ steps.detect.outputs.yarn_version }}
          setup_bun: ${{ steps.detect.outputs.setup_bun }}
          bun_version: ${{ steps.detect.outputs.bun_version }}
          setup_rust: ${{ steps.detect.outputs.setup_rust }}
          rust_root: ${{ steps.detect.outputs.rust_root }}

      # No install script runs here: lockfiles are updated in lockfile only mode. A majors
      # dispatch has no safe step, so only the majors job below does anything for it.
      - name: Apply the plan
        id: apply
        if: steps.detect.outputs.has_steps == 'true'
        uses: $/actions/fix-runner
        with:
          step: apply
          plan: ${{ inputs.plan }}
          encoding: ${{ inputs.encoding }}
          run_id: ${{ inputs.run_id }}
          checks: ${{ inputs.checks }}
          defer_checks: 'true'

      # Install scripts and the repo's checks run from here on (full mode only). Whatever
      # they do, the publish job checks the patch against the outputs set above.
      - name: Install and run the checks
        if: steps.apply.outputs.has_changes == 'true'
        uses: $/actions/fix-runner
        with:
          step: check
          plan: ${{ inputs.plan }}
          encoding: ${{ inputs.encoding }}
          run_id: ${{ inputs.run_id }}
          checks: ${{ inputs.checks }}

      - name: Upload the patch and the result
        if: always() && steps.apply.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.detect.outputs.artifact_name }}
          path: .hinomi/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Push the fix branch
    needs: apply
    if: needs.apply.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.publish.outputs.branch }}
      pushed: ${{ steps.publish.outputs.pushed }}
    steps:
      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.apply.outputs.base_sha }}
          persist-credentials: false

      - name: Download the patch and the result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.apply.outputs.artifact_name }}
          path: ${{ runner.temp }}/hinomi-fix

      - name: Verify the patch and push the fix branch
        id: publish
        uses: $/actions/fix-runner
        with:
          step: publish
          run_id: ${{ inputs.run_id }}
          artifact_dir: ${{ runner.temp }}/hinomi-fix
          base_sha: ${{ needs.apply.outputs.base_sha }}
          patch_sha256: ${{ needs.apply.outputs.patch_sha256 }}
          patch_files: ${{ needs.apply.outputs.patch_files }}
          dry_run: ${{ inputs.dry_run }}
          token: ${{ github.token }}

  majors:
    name: Run the majors agent
    needs: apply
    if: needs.apply.outputs.agent_needed == 'true'
    runs-on: ubuntu-24.04
    # The agent stops itself after 40 minutes; setup and capture fit in the rest.
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.agent.outputs.has_changes }}
      base_sha: ${{ steps.agent.outputs.base_sha }}
      patch_sha256: ${{ steps.agent.outputs.patch_sha256 }}
      patch_files: ${{ steps.agent.outputs.patch_files }}
      artifact_name: ${{ steps.detect.outputs.artifact_name }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the plan and detect the toolchains
        id: detect
        uses: $/actions/fix-runner
        with:
          step: detect
          scope: majors
          plan: ${{ inputs.plan }}
          encoding: ${{ inputs.encoding }}
          run_id: ${{ inputs.run_id }}

      - name: Set up the toolchains
        uses: $/actions/fix-toolchain
        with:
          setup_node: ${{ steps.detect.outputs.setup_node }}
          node_version_file: ${{ steps.detect.outputs.node_version_file }}
          setup_pnpm: ${{ steps.detect.outputs.setup_pnpm }}
          pnpm_version: ${{ steps.detect.outputs.pnpm_version }}
          pnpm_package_json: ${{ steps.detect.outputs.pnpm_package_json }}
          setup_yarn: ${{ steps.detect.outputs.setup_yarn }}
          yarn_version: ${{ steps.detect.outputs.yarn_version }}
          setup_bun: ${{ steps.detect.outputs.setup_bun }}
          bun_version: ${{ steps.detect.outputs.bun_version }}
          setup_rust: ${{ steps.detect.outputs.setup_rust }}
          rust_root: ${{ steps.detect.outputs.rust_root }}

      # The key reaches the agent process only (the action strips it from every other command).
      # The result and patch are written to the runner's temp folder after the agent is gone.
      - name: Run the agent and capture its patch
        id: agent
        uses: $/actions/fix-runner
        with:
          step: agent
          plan: ${{ inputs.plan }}
          encoding: ${{ inputs.encoding }}
          run_id: ${{ inputs.run_id }}
          dry_run: ${{ inputs.dry_run }}
          agent_secret: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload the patch and the result
        if: always() && steps.agent.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.detect.outputs.artifact_name }}
          path: ${{ steps.agent.outputs.output_dir }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  majors-publish:
    name: Push the majors branch
    needs: majors
    if: needs.majors.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.publish.outputs.branch }}
      pushed: ${{ steps.publish.outputs.pushed }}
    steps:
      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.majors.outputs.base_sha }}
          persist-credentials: false

      - name: Download the patch and the result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.majors.outputs.artifact_name }}
          path: ${{ runner.temp }}/hinomi-majors

      - name: Verify the patch and push the majors branch
        id: publish
        uses: $/actions/fix-runner
        with:
          step: publish
          scope: majors
          run_id: ${{ inputs.run_id }}
          artifact_dir: ${{ runner.temp }}/hinomi-majors
          base_sha: ${{ needs.majors.outputs.base_sha }}
          patch_sha256: ${{ needs.majors.outputs.patch_sha256 }}
          patch_files: ${{ needs.majors.outputs.patch_files }}
          dry_run: ${{ inputs.dry_run }}
          token: ${{ github.token }}
