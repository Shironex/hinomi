name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # bun for the fix runner's real lockfile tests; yarn classic comes with the runner image.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check the fix runner bundle is committed and current
        run: |
          changes=$(git status --porcelain -- actions/fix-runner/dist)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "actions/fix-runner/dist is out of date: run pnpm --filter @hinomi/fix-runner build and commit it."
            exit 1
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: hinomi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name hinomi -p 3000:3000 hinomi:ci
          healthy=false
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then healthy=true; break; fi
            sleep 1
          done
          if [ "$healthy" != true ]; then
            docker logs hinomi
            exit 1
          fi
          echo
          uid=$(docker exec hinomi id -u)
          if [ "$uid" != 10001 ]; then
            echo "expected the server to run as uid 10001, got $uid"
            exit 1
          fi
          echo "running as uid $uid"
