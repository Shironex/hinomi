name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      # bun for the fix runner's real lockfile tests; yarn classic comes with the runner image.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check the fix runner bundle is committed and current
        run: |
          changes=$(git status --porcelain -- actions/fix-runner/dist)
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "actions/fix-runner/dist is out of date: run pnpm --filter @hinomi/fix-runner build and commit it."
            exit 1
          fi

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned actionlint and zizmor, checked against their SHA-256, over every workflow and
      # the caller template in docs/runner.
      - run: .github/scripts/lint-workflows.sh

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: hinomi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name hinomi -p 3000:3000 hinomi:ci
          healthy=false
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then healthy=true; break; fi
            sleep 1
          done
          if [ "$healthy" != true ]; then
            docker logs hinomi
            exit 1
          fi
          echo
          uid=$(docker exec hinomi id -u)
          if [ "$uid" != 10001 ]; then
            echo "expected the server to run as uid 10001, got $uid"
            exit 1
          fi
          echo "running as uid $uid"
