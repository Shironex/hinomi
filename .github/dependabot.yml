version: 2
updates:
  # pnpm workspace: Dependabot reads pnpm-lock.yaml through the npm ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - chore
    ignore:
      # Types follow the Node runtime (22 LTS); move both together by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    # The composite action the fix workflow uses pins actions too.
    directories:
      - /
      - /actions/fix-toolchain
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci(deps)'
    labels:
      - chore
      - area:infra
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build(deps)'
    labels:
      - chore
      - area:infra
    ignore:
      # Stay on a Node LTS line; odd releases are not LTS. Move to the next LTS by hand.
      - dependency-name: node
        update-types: ['version-update:semver-major']
