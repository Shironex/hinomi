services:
  hinomi:
    # Pull the published image. HINOMI_VERSION pins a release (for example 0.1.0); the default follows latest.
    image: ghcr.io/shironex/hinomi:${HINOMI_VERSION:-latest}
    # To build from source instead, comment out the image line above and uncomment these two:
    # build: .
    # image: hinomi:local
    ports:
      - '3000:3000'
    env_file:
      - path: .env
        required: false
    volumes:
      - hinomi-data:/data
    restart: unless-stopped
    # Longer than HINOMI_SHUTDOWN_TIMEOUT_SECONDS (25 s), so a running scan can finish on stop.
    stop_grace_period: 30s

volumes:
  hinomi-data:
