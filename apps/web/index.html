<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Hinomi</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Keep the colors in sync with the background tokens in src/index.css and src/lib/theme.ts. -->
    <meta name="theme-color" content="#f8f5fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#160f1e" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      // Keep the key and values in sync with src/lib/theme.ts.
      ;(function () {
        var pref = 'system'
        try {
          var saved = localStorage.getItem('hinomi:theme')
          if (saved === 'light' || saved === 'dark' || saved === 'system') pref = saved
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
