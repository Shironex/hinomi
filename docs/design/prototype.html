<title>Hinomi Exposure Watch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a quiet ops console. Fixed side rail (bottom tabs on phones), one working column,
   a ranked list as the spine of every view. Indigo (ai-zome) is the only accent; severity colors are
   a separate semantic set and always ride with an icon and a word. */
:root{
  /* neutrals, tinted toward indigo 265 */
  --bg: oklch(0.982 0.004 265);
  --surface: oklch(0.996 0.002 265);
  --surface-2: oklch(0.962 0.007 265);
  --surface-3: oklch(0.935 0.009 265);
  --fg: oklch(0.235 0.02 265);
  --fg-2: oklch(0.40 0.02 265);
  --muted: oklch(0.50 0.018 265);
  --border: oklch(0.900 0.009 265);
  --border-strong: oklch(0.82 0.012 265);
  /* accent: ai-zome indigo */
  --accent: oklch(0.47 0.135 268);
  --accent-hover: oklch(0.42 0.14 268);
  --accent-fg: oklch(0.985 0.008 268);
  --accent-soft: oklch(0.945 0.028 268);
  --accent-ink: oklch(0.43 0.14 268);
  --ring: oklch(0.58 0.15 268);
  /* severity: ink for text and icons, soft for chip fills */
  --crit: oklch(0.53 0.185 30);
  --crit-soft: oklch(0.955 0.025 30);
  --high: oklch(0.52 0.13 58);
  --high-soft: oklch(0.96 0.03 70);
  --mod: oklch(0.50 0.085 100);
  --mod-soft: oklch(0.96 0.03 100);
  --low: oklch(0.52 0.03 250);
  --low-soft: oklch(0.955 0.008 250);
  /* state */
  --ok: oklch(0.50 0.11 158);
  --ok-soft: oklch(0.95 0.03 158);
  --warn: var(--high);
  --shadow: 0 1px 2px oklch(0.3 0.03 265 / 0.06), 0 4px 16px oklch(0.3 0.03 265 / 0.06);
  --shadow-pop: 0 2px 6px oklch(0.25 0.03 265 / 0.10), 0 16px 40px oklch(0.25 0.03 265 / 0.14);

  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --text-xs: 0.75rem;   /* 12 */
  --text-sm: 0.8125rem; /* 13 */
  --text-base: 0.875rem;/* 14 */
  --text-md: 1rem;      /* 16 */
  --text-lg: 1.25rem;   /* 20 */
  --text-xl: 1.625rem;  /* 26 */
  --text-2xl: 2.25rem;  /* 36, funnel numerals only */
  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 10px;
  --rail-w: 232px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: oklch(0.172 0.012 265); --surface: oklch(0.205 0.014 265); --surface-2: oklch(0.155 0.012 265); --surface-3: oklch(0.255 0.016 265);
    --fg: oklch(0.935 0.008 265); --fg-2: oklch(0.80 0.012 265); --muted: oklch(0.69 0.016 265);
    --border: oklch(0.295 0.016 265); --border-strong: oklch(0.38 0.018 265);
    --accent: oklch(0.72 0.115 268); --accent-hover: oklch(0.78 0.10 268); --accent-fg: oklch(0.17 0.03 268); --accent-soft: oklch(0.29 0.05 268); --accent-ink: oklch(0.79 0.10 268); --ring: oklch(0.72 0.13 268);
    --crit: oklch(0.72 0.15 30); --crit-soft: oklch(0.29 0.06 30);
    --high: oklch(0.79 0.12 70); --high-soft: oklch(0.29 0.045 70);
    --mod: oklch(0.80 0.08 102); --mod-soft: oklch(0.28 0.035 102);
    --low: oklch(0.74 0.03 250); --low-soft: oklch(0.27 0.012 250);
    --ok: oklch(0.76 0.12 158); --ok-soft: oklch(0.28 0.045 158);
    --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 4px 16px oklch(0 0 0 / 0.25);
    --shadow-pop: 0 2px 6px oklch(0 0 0 / 0.35), 0 16px 40px oklch(0 0 0 / 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
    --bg: oklch(0.172 0.012 265); --surface: oklch(0.205 0.014 265); --surface-2: oklch(0.155 0.012 265); --surface-3: oklch(0.255 0.016 265);
    --fg: oklch(0.935 0.008 265); --fg-2: oklch(0.80 0.012 265); --muted: oklch(0.69 0.016 265);
    --border: oklch(0.295 0.016 265); --border-strong: oklch(0.38 0.018 265);
    --accent: oklch(0.72 0.115 268); --accent-hover: oklch(0.78 0.10 268); --accent-fg: oklch(0.17 0.03 268); --accent-soft: oklch(0.29 0.05 268); --accent-ink: oklch(0.79 0.10 268); --ring: oklch(0.72 0.13 268);
    --crit: oklch(0.72 0.15 30); --crit-soft: oklch(0.29 0.06 30);
    --high: oklch(0.79 0.12 70); --high-soft: oklch(0.29 0.045 70);
    --mod: oklch(0.80 0.08 102); --mod-soft: oklch(0.28 0.035 102);
    --low: oklch(0.74 0.03 250); --low-soft: oklch(0.27 0.012 250);
    --ok: oklch(0.76 0.12 158); --ok-soft: oklch(0.28 0.045 158);
    --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 4px 16px oklch(0 0 0 / 0.25);
    --shadow-pop: 0 2px 6px oklch(0 0 0 / 0.35), 0 16px 40px oklch(0 0 0 / 0.45);
    color-scheme: dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:var(--text-base);line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01" 0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:var(--radius-sm)}
.mono{font-family:var(--font-mono);font-size:0.92em;letter-spacing:-0.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.fg2{color:var(--fg-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:16px;height:16px;flex:none;stroke-width:1.75}
svg.i.sm{width:14px;height:14px}
svg.i.lg{width:20px;height:20px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-0.012em}
h1{font-size:var(--text-xl);line-height:1.2}
h2{font-size:var(--text-md);line-height:1.3}
h3{font-size:var(--text-base)}
p{margin:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;height:100dvh;background:var(--surface-2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px 12px;gap:4px;padding-left:max(10px, env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;color:var(--fg)}
.brand:hover{text-decoration:none}
.brand-name{font-weight:600;font-size:15px;letter-spacing:-0.01em}
.brand-sub{font-size:var(--text-xs);color:var(--muted);margin-left:auto;font-family:var(--font-mono)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-label{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px;font-weight:500}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--radius-md);color:var(--fg-2);font-weight:500;font-size:var(--text-base)}
.nav a:hover{background:var(--surface-3);text-decoration:none;color:var(--fg)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--border)}
.nav a[aria-current="page"] svg{color:var(--accent-ink)}
.nav a .count{margin-left:auto;font-size:var(--text-xs);font-variant-numeric:tabular-nums;color:var(--muted)}
.nav a .count.hot{color:var(--crit);font-weight:600}
.nav a.disabled{opacity:.45;pointer-events:none}
.tag-soon{margin-left:auto;font-size:10.5px;padding:1px 6px;border-radius:999px;border:1px solid var(--border-strong);color:var(--muted);font-weight:500}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px 4px 0;border-top:1px solid var(--border)}
.scanline{display:flex;align-items:center;gap:8px;font-size:var(--text-xs);color:var(--muted);padding:0 6px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);flex:none}
.seg{display:inline-flex;background:var(--surface-3);border-radius:var(--radius-md);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 8px;border-radius:4px;font-size:var(--text-xs);color:var(--fg-2);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px oklch(0.2 0.02 265 / .12)}
.rail-links{display:flex;flex-direction:column;gap:2px}
.rail-links a{font-size:var(--text-xs);color:var(--muted);display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:4px}
.rail-links a:hover{color:var(--fg);background:var(--surface-3);text-decoration:none}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in oklch, var(--bg) 88%, transparent);backdrop-filter:saturate(1.2) blur(8px);-webkit-backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(24px, env(safe-area-inset-left,0px));padding-right:max(24px, env(safe-area-inset-right,0px));min-height:52px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:var(--text-sm);color:var(--muted);min-width:0}
.crumbs a{color:var(--muted)}
.crumbs strong{color:var(--fg);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.mobile-brand{display:none}
.content{padding-block:24px 64px;padding-left:max(24px, env(safe-area-inset-left,0px));padding-right:max(24px, env(safe-area-inset-right,0px));width:100%;max-width:1280px}

/* ---------- primitives (map to shadcn Button/Badge/Input/Card/Select) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);font-weight:500;font-size:var(--text-sm);cursor:pointer;white-space:nowrap;transition:background .15s, border-color .15s, transform .1s}
.btn:hover{background:var(--surface-3);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-3);color:var(--fg)}
.btn.sm{height:26px;padding:0 8px;font-size:var(--text-xs);gap:5px}
.btn.lg{height:38px;padding:0 16px;font-size:var(--text-base)}
.btn .kbd{margin-left:4px}
.kbd{font-family:var(--font-mono);font-size:10.5px;line-height:1;padding:3px 5px;border-radius:4px;border:1px solid var(--border-strong);border-bottom-width:2px;color:var(--muted);background:var(--surface)}
.btn.primary .kbd{background:transparent;color:var(--accent-fg);border-color:color-mix(in oklch, var(--accent-fg) 40%, transparent)}

.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:var(--radius-sm);font-size:var(--text-xs);font-weight:500;white-space:nowrap;border:1px solid var(--border);color:var(--fg-2);background:var(--surface)}
.badge svg.i{width:13px;height:13px;stroke-width:2}
.sev{border-color:transparent}
.sev-critical{background:var(--crit-soft);color:var(--crit)}
.sev-high{background:var(--high-soft);color:var(--high)}
.sev-moderate{background:var(--mod-soft);color:var(--mod)}
.sev-low{background:var(--low-soft);color:var(--low)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.accent{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.badge.outline{background:transparent}
.badge.warn{background:var(--high-soft);color:var(--high);border-color:transparent}
.badge.bad{background:var(--crit-soft);color:var(--crit);border-color:transparent}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.panel-h h2{font-size:var(--text-base)}
.panel-b{padding:16px}
.section{display:flex;flex-direction:column;gap:12px}
.section + .section{margin-top:32px}
.section-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.section-h p{color:var(--muted);font-size:var(--text-sm)}
.section-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .label{font-size:var(--text-sm);font-weight:500;color:var(--fg)}
.field .help{font-size:var(--text-xs);color:var(--muted)}
.field .err{font-size:var(--text-xs);color:var(--crit);display:flex;gap:5px;align-items:center}
.input,.select,textarea.input{height:34px;padding:0 10px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:var(--surface);color:var(--fg);font-size:var(--text-sm);width:100%;min-width:0}
textarea.input{height:auto;min-height:72px;padding:8px 10px;resize:vertical;line-height:1.45}
.input::placeholder{color:var(--muted);opacity:.85}
.input:focus,.select:focus{outline:2px solid var(--ring);outline-offset:-1px;border-color:transparent}
.input[aria-invalid="true"]{border-color:var(--crit)}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap svg{position:absolute;left:9px;color:var(--muted);pointer-events:none}
.input-wrap .input{padding-left:30px}
.input-wrap .kbd{position:absolute;right:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:12px}
hr.sep{border:0;border-top:1px solid var(--border);margin:0}

/* ---------- factor strip: the ranking made visible ---------- */
.factors{display:inline-grid;grid-template-columns:repeat(4,10px);gap:2px;align-items:center;flex:none}
.factors i{display:block;height:14px;border-radius:2px;background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--border)}
.factors i.on{background:var(--fg-2);box-shadow:none}
.factors.t1 i.on{background:var(--crit)}
.factors-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--text-xs);color:var(--muted)}
.factors-legend span{display:inline-flex;gap:6px;align-items:center}
.factors-legend b{display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center;border-radius:3px;background:var(--surface-3);color:var(--fg-2);font-weight:600;font-size:10px;font-family:var(--font-mono)}

/* ---------- overview ---------- */
.ov-head{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.ov-head .lede{color:var(--fg-2);max-width:62ch;margin-top:6px}
.ov-head .right{margin-left:auto;display:flex;gap:8px}
.sieve{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden}
.sieve-step{position:relative;padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--border);min-width:0;color:inherit}
.sieve-step:hover{background:var(--surface-2);text-decoration:none}
.sieve-step:last-child{border-right:0;background:var(--accent-soft)}
.sieve-step:last-child:hover{background:color-mix(in oklch, var(--accent-soft) 80%, var(--surface-3))}
.sieve-step .n{font-size:var(--text-xl);font-weight:600;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.sieve-step:last-child .n{color:var(--accent-ink)}
.sieve-step .l{font-size:var(--text-sm);color:var(--fg-2);line-height:1.35}
.sieve-step .q{font-size:var(--text-xs);color:var(--muted)}
.sieve-step .ls{display:none}
.sieve-bar{height:4px;border-radius:2px;background:var(--surface-3);margin-top:8px;overflow:hidden}
.sieve-bar span{display:block;height:100%;background:var(--fg-2);border-radius:2px}
.sieve-step:last-child .sieve-bar span{background:var(--accent)}
.sieve-step:not(:last-child)::after{content:"";position:absolute;right:-6px;top:50%;width:10px;height:10px;transform:translateY(-50%) rotate(45deg);background:inherit;border-top:1px solid var(--border);border-right:1px solid var(--border);z-index:1;background:var(--surface)}
.sieve-step:not(:last-child):hover::after{background:var(--surface-2)}

.ov-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;margin-top:28px;align-items:start}
.flist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.frow{display:grid;grid-template-columns:28px 46px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--border);color:inherit;cursor:pointer;position:relative}
.frow:first-child{border-top:0}
.frow:hover,.frow.kb{background:var(--surface-2);text-decoration:none}
.frow.kb{box-shadow:inset 2px 0 0 var(--accent)}
.frow .rank{font-family:var(--font-mono);font-size:var(--text-sm);color:var(--muted);text-align:right}
.frow .title{display:flex;flex-direction:column;gap:5px;min-width:0}
.frow .tl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.frow .pkg{font-family:var(--font-mono);font-weight:500;font-size:var(--text-sm)}
.frow .bump{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--muted)}
.frow .bump b{color:var(--ok);font-weight:500}
.frow .sum{display:block;color:var(--fg);font-size:var(--text-base);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .where{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:var(--text-xs);color:var(--muted);align-items:center}
.frow .where span{display:inline-flex;gap:5px;align-items:center}
.frow .act{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.frow.accepted{background:repeating-linear-gradient(135deg, transparent 0 8px, color-mix(in oklch, var(--surface-3) 45%, transparent) 8px 9px)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:500;color:var(--fg-2);white-space:nowrap}
.state svg{width:14px;height:14px}
.state.run{color:var(--accent-ink)}
.state.ok{color:var(--ok)}
.state.bad{color:var(--crit)}
.state.wait{color:var(--high)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.aside{display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:var(--text-sm)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:var(--text-sm)}
.src:first-child{border-top:0;padding-top:0}
.src .ico{width:30px;height:30px;border-radius:var(--radius-md);background:var(--surface-3);display:grid;place-items:center;color:var(--fg-2);flex:none}
.src .meta{display:flex;flex-direction:column;min-width:0}
.src .meta small{color:var(--muted);font-size:var(--text-xs)}
.src .st{margin-left:auto}
.feed{display:flex;flex-direction:column}
.feed li{list-style:none;display:grid;grid-template-columns:18px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--border);font-size:var(--text-sm)}
.feed li:first-child{border-top:0;padding-top:0}
.feed ul{margin:0;padding:0}
.feed time{display:block;color:var(--muted);font-size:var(--text-xs)}
.tier-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tier-card{padding:14px 16px;display:flex;flex-direction:column;gap:6px;color:inherit;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}
.tier-card:hover{border-color:var(--border-strong);text-decoration:none;background:var(--surface-2)}
.tier-card .n{font-size:var(--text-lg);font-weight:600;font-variant-numeric:tabular-nums}
.tier-card .l{font-size:var(--text-sm);color:var(--fg-2)}
.tier-card .d{font-size:var(--text-xs);color:var(--muted)}
.mixbar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:1px;background:var(--surface-3);margin-top:4px}
.mixbar span{display:block;height:100%}
.callout{display:flex;gap:12px;padding:12px 14px;border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface-2);font-size:var(--text-sm);align-items:flex-start}
.callout svg{margin-top:2px;color:var(--fg-2)}
.callout.warn{background:var(--high-soft);border-color:color-mix(in oklch, var(--high) 25%, transparent)}
.callout.warn svg{color:var(--high)}
.callout.info{background:var(--accent-soft);border-color:color-mix(in oklch, var(--accent) 22%, transparent)}
.callout.info svg{color:var(--accent-ink)}
.callout .body{display:flex;flex-direction:column;gap:4px;min-width:0}
.callout .acts{margin-left:auto;display:flex;gap:6px;flex:none}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:var(--text-xs);padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td,.tbl tbody tr.kb td{background:var(--surface-2)}
.tbl tbody tr.kb td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.tbl .grp td{background:var(--surface-2);font-size:var(--text-xs);color:var(--fg-2);padding:8px 12px;font-weight:500}
.tbl .grp td .gl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbl .more td{text-align:center;padding:8px}
.app-cell{display:flex;flex-direction:column;gap:2px;min-width:0}
.app-cell b{font-weight:500}
.app-cell small{color:var(--muted);font-size:var(--text-xs)}
.sevcount{display:inline-flex;gap:4px;align-items:center}
.sevcount .c{display:inline-flex;align-items:center;gap:3px;font-size:var(--text-xs);font-weight:600;font-variant-numeric:tabular-nums;padding:1px 5px;border-radius:3px}
.expand td{background:var(--surface-2)}
.join{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;align-items:stretch;padding:4px 0}
.join .node{display:flex;flex-direction:column;gap:3px;padding:10px 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-md);min-width:0}
.join .node small{color:var(--muted);font-size:var(--text-xs)}
.join .node b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.join .link{display:flex;align-items:center;gap:8px}
.join .link::before{content:"";flex:none;width:14px;height:1px;background:var(--border-strong)}
.join .link:first-child::before{display:none}

/* ---------- filters ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);font-size:var(--text-xs);font-weight:500;cursor:pointer;color:var(--fg-2)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip svg.i{width:13px;height:13px}
.filters .select{width:auto;height:28px;font-size:var(--text-xs);padding:0 8px;border-radius:999px}
.filters .input-wrap{flex:1;min-width:180px}
.filters .input{height:28px;font-size:var(--text-xs);border-radius:999px}
.resultline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:var(--text-xs);color:var(--muted);padding:2px 2px}
.resultline b{color:var(--fg);font-weight:500}

/* ---------- finding detail ---------- */
.fd-head{display:flex;flex-direction:column;gap:10px;padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:24px}
.fd-head .ids{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:var(--text-xs);color:var(--muted)}
.fd-head h1{font-size:var(--text-lg);max-width:60ch}
.fd-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden}
.why > div{padding:12px 14px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;min-width:0}
.why > div:last-child{border-right:0}
.why .k{display:flex;align-items:center;gap:6px;font-size:var(--text-xs);color:var(--muted)}
.why .k svg{color:var(--crit)}
.why .v{font-weight:500;font-size:var(--text-sm)}
.why .s{font-size:var(--text-xs);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:0 0 18px;position:relative}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:13px;top:26px;bottom:2px;width:2px;background:var(--border);border-radius:1px}
.step:last-child::before{display:none}
.step.done::before{background:var(--ok)}
.step .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--border-strong);color:var(--muted);z-index:1}
.step.done .dot{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.step.now .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:0 0 0 4px var(--accent-soft)}
.step.fail .dot{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.step .st-t{font-weight:500;font-size:var(--text-sm);padding-top:4px}
.step .st-d{font-size:var(--text-xs);color:var(--muted);margin-top:2px}
.step.todo .st-t{color:var(--muted);font-weight:400}
.step .st-r{font-size:var(--text-xs);color:var(--muted);padding-top:5px;white-space:nowrap}
.log{margin-top:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;font-family:var(--font-mono);font-size:11.5px;line-height:1.65;color:var(--fg-2);max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.log .ok{color:var(--ok)}
.log .dim{color:var(--muted)}
.checks{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.checks div{display:flex;gap:8px;align-items:center;font-size:var(--text-xs);color:var(--fg-2)}
.proto{display:flex;gap:8px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--border-strong);font-size:var(--text-xs);color:var(--muted);flex-wrap:wrap}
.proto .btn{border-style:dashed}
.affected{display:flex;flex-direction:column}
.affected a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--border);color:inherit;align-items:center}
.affected a:first-child{border-top:0;padding-top:0}
.affected a:hover{text-decoration:none}
.affected a:hover b{text-decoration:underline}
.prose{color:var(--fg-2);max-width:68ch;display:flex;flex-direction:column;gap:10px;font-size:var(--text-base)}
.prose code,.code-inline{font-family:var(--font-mono);font-size:.88em;background:var(--surface-3);padding:1px 5px;border-radius:4px;color:var(--fg)}
.snooze-banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-lg);background:var(--surface-2);border:1px dashed var(--border-strong);font-size:var(--text-sm)}
.depgraph{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--fg-2);line-height:1.8;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;overflow-x:auto;white-space:pre}
.depgraph b{color:var(--crit);font-weight:500}

/* ---------- settings ---------- */
.set-grid{display:grid;grid-template-columns:180px minmax(0,1fr);gap:32px;align-items:start}
.subnav{position:sticky;top:76px;display:flex;flex-direction:column;gap:1px}
.subnav a{padding:6px 10px;border-radius:var(--radius-md);color:var(--fg-2);font-size:var(--text-sm)}
.subnav a:hover{background:var(--surface-3);text-decoration:none;color:var(--fg)}
.set-sec{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;padding:24px 0;border-top:1px solid var(--border)}
.set-sec:first-child{border-top:0;padding-top:0}
.set-sec .intro p{color:var(--muted);font-size:var(--text-sm);margin-top:6px}
.conn{display:flex;flex-direction:column;gap:14px}
.conn-h{display:flex;align-items:center;gap:10px}
.toggle{position:relative;width:34px;height:20px;border-radius:999px;background:var(--border-strong);border:0;cursor:pointer;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .18s cubic-bezier(.22,1,.36,1)}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{transform:translateX(14px)}
.opt{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.opt:first-child{border-top:0}
.opt .txt{display:flex;flex-direction:column;flex:1;min-width:0}
.opt .txt small{color:var(--muted);font-size:var(--text-xs)}

/* ---------- onboarding ---------- */
.ob{max-width:760px;margin:8px auto 0;display:flex;flex-direction:column;gap:24px}
.ob-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.ob-hero p{color:var(--fg-2);margin-top:8px;max-width:56ch}
.ob-steps{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden}
.ob-step{border-top:1px solid var(--border)}
.ob-step:first-child{border-top:0}
.ob-step-h{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px;width:100%;background:transparent;border:0;text-align:left;cursor:pointer}
.ob-step-h .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--border-strong);color:var(--muted);font-family:var(--font-mono);font-size:var(--text-xs);font-weight:500}
.ob-step.active .dot{border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px var(--accent-soft)}
.ob-step.done .dot{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.ob-step-h .t{display:flex;flex-direction:column}
.ob-step-h .t b{font-weight:500}
.ob-step-h .t small{color:var(--muted);font-size:var(--text-xs)}
.ob-step-b{padding:4px 18px 20px 60px;display:flex;flex-direction:column;gap:14px}
.ob-step.locked .ob-step-h{cursor:default}
.ob-step.locked .t b{color:var(--muted)}
.progress-lines{display:flex;flex-direction:column;gap:6px;font-size:var(--text-sm)}
.progress-lines div{display:flex;gap:8px;align-items:center}
.tower-art{width:132px;height:132px;flex:none}

/* ---------- drift + notes ---------- */
.guard{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;padding:16px;border-top:1px solid var(--border);align-items:start}
.guard:first-child{border-top:0}
.guard .ico{width:36px;height:36px;border-radius:var(--radius-md);background:var(--surface-3);display:grid;place-items:center;color:var(--fg-2)}
.guard .ex{margin-top:8px;font-size:var(--text-xs);color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.guard .ex .mono{color:var(--fg-2)}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.name-card{padding:16px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}
.name-card.fav{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.name-card .nm{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.name-card .nm b{font-size:var(--text-lg);font-weight:600;letter-spacing:-0.015em}
.name-card .nm span{color:var(--muted);font-size:var(--text-sm)}
.name-card p{color:var(--fg-2);font-size:var(--text-sm)}
.name-card .chk{font-size:var(--text-xs);color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.wm-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wm-tile{border-radius:var(--radius-lg);padding:28px 24px;display:flex;flex-direction:column;gap:18px;border:1px solid var(--border)}
.wm-tile.light{background:oklch(0.985 0.004 265);color:oklch(0.235 0.02 265)}
.wm-tile.dark{background:oklch(0.172 0.012 265);color:oklch(0.935 0.008 265);border-color:oklch(0.295 0.016 265)}
.wm{display:flex;align-items:center;gap:12px}
.wm .word{font-size:34px;font-weight:600;letter-spacing:-0.03em;line-height:1}
.wm-small{display:flex;gap:14px;align-items:center;font-size:var(--text-xs);opacity:.8}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.sw{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--surface);font-size:var(--text-xs)}
.sw .chipc{height:44px;border-bottom:1px solid var(--border)}
.sw .meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.sw .meta b{font-weight:500;font-family:var(--font-mono);font-size:11.5px}
.sw .meta span{color:var(--muted);font-family:var(--font-mono);font-size:10.5px;overflow-wrap:anywhere}
.typescale{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}
.typescale div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:10px 14px;border-top:1px solid var(--border);align-items:baseline}
.typescale div:first-child{border-top:0}
.typescale small{color:var(--muted);font-family:var(--font-mono);font-size:11px}
.codeblock{position:relative;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:auto;max-height:520px}
.codeblock pre{margin:0;padding:14px 16px;font-family:var(--font-mono);font-size:12px;line-height:1.6;color:var(--fg-2)}
.codeblock .btn{position:sticky;float:right;top:8px;margin:8px 8px 0 0}

/* ---------- overlays ---------- */
.toast-host{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:40}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:var(--radius-md);font-size:var(--text-sm);box-shadow:var(--shadow-pop);display:flex;gap:10px;align-items:center;max-width:360px;animation:rise .22s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.sheet-back{position:fixed;inset:0;background:oklch(0.2 0.02 265 / .35);z-index:30;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);width:min(460px,100%);max-height:80vh;overflow:auto}
.sheet .panel-b{display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:var(--text-sm)}
.sheet .panel-b .kbd{justify-self:end}
.mobile-tabs{display:none}
.show-sm{display:none!important}
.show-inline-sm{display:none}
.stack > .section + .section{margin-top:0}
dl.kv{margin:0}

/* ---------- responsive ---------- */
@media (max-width: 1080px){
  .ov-grid,.fd-grid{grid-template-columns:minmax(0,1fr)}
  .aside{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .set-grid{grid-template-columns:minmax(0,1fr)}
  .subnav{display:none}
}
@media (max-width: 860px){
  .sieve{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sieve-step{border-bottom:1px solid var(--border)}
  .sieve-step::after{display:none}
  .sieve-step:last-child{grid-column:1 / -1;border-bottom:0}
  .why{grid-template-columns:repeat(2,minmax(0,1fr))}
  .why > div:nth-child(2){border-right:0}
  .why > div:nth-child(-n+2){border-bottom:1px solid var(--border)}
  .set-sec{grid-template-columns:minmax(0,1fr);gap:14px}
  .tier-cards{grid-template-columns:minmax(0,1fr)}
  .join{grid-template-columns:minmax(0,1fr);gap:6px}
  .join .link::before{display:none}
}
@media (max-width: 760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mobile-brand{display:flex;align-items:center;gap:8px;color:var(--fg);font-weight:600}
  .topbar{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  .crumbs{display:none}
  .content{padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .mobile-tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .mobile-tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;color:var(--muted);font-size:10.5px;font-weight:500;position:relative}
  .mobile-tabs a[aria-current="page"]{color:var(--accent-ink)}
  .mobile-tabs a:hover{text-decoration:none}
  .mobile-tabs .pip{position:absolute;top:5px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--crit);color:var(--surface);font-size:10px;display:grid;place-items:center;padding:0 4px}
  .aside{grid-template-columns:minmax(0,1fr)}
  .sieve{grid-template-columns:repeat(5,minmax(0,1fr))}
  .sieve-step{padding:10px 6px 10px 10px;border-bottom:0;gap:2px}
  .sieve-step:last-child{grid-column:auto}
  .sieve-step .n{font-size:var(--text-md)}
  .sieve-step .l,.sieve-step .q,.sieve-bar{display:none}
  .sieve-step .ls{display:block;font-size:10.5px;color:var(--muted);line-height:1.2}
  .frow{grid-template-columns:minmax(0,1fr);gap:10px;padding:14px}
  .frow .rank,.frow > .factors{display:none}
  .frow .act{grid-column:1 / -1;flex-direction:row;justify-content:space-between;align-items:center}
  .frow .sum{white-space:normal}
  .ov-head .right{margin-left:0}
  .names,.wm-row,.grid2{grid-template-columns:minmax(0,1fr)}
  .ob-step-b{padding-left:18px}
  .ob-hero{grid-template-columns:minmax(0,1fr)}
  .tower-art{display:none}
  .hide-sm{display:none!important}
  .show-sm{display:flex!important}
  .show-inline-sm{display:inline}
  .tbl.cards thead{display:none}
  .tbl.cards, .tbl.cards tbody, .tbl.cards tr, .tbl.cards td{display:block;width:100%}
  .tbl.cards tr.click,.tbl.cards tr.data{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px;border-top:1px solid var(--border)}
  .tbl.cards tr.click td,.tbl.cards tr.data td{padding:0;border:0;background:transparent!important}
  .tbl.cards td.wide{grid-column:1 / -1}
  .tbl.cards td.hide-card{display:none}
  .tbl.cards.alerts tr.click{grid-template-columns:24px auto minmax(0,1fr)}
  .tbl.cards.alerts td.wide{grid-column:2 / -1}
  .tbl.cards tr.grp td.cb{display:none}
  .bulkbar{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .tbl.cards tr.grp td,.tbl.cards tr.more td{border-top:1px solid var(--border)}
  .tbl.cards tr.expand td{padding:12px}
  .typescale div{grid-template-columns:minmax(0,1fr)}
  .sheet .panel-b{grid-template-columns:1fr auto}
}

/* ---------- round 2 additions ---------- */
.term{border-bottom:1px dotted currentColor;cursor:help;text-decoration:none}
.term:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.factors i.unk{background:repeating-linear-gradient(135deg, var(--crit) 0 2px, transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--crit)}
.frow.blind{background:color-mix(in oklch, var(--crit-soft) 45%, var(--surface))}
.frow.blind:hover,.frow.blind.kb{background:color-mix(in oklch, var(--crit-soft) 75%, var(--surface))}
.src-b{height:20px;font-size:11px;padding:0 6px;color:var(--muted)}
.src-b svg.i{width:12px;height:12px}
.snooze-banner.expired{border-style:solid;border-color:color-mix(in oklch, var(--high) 35%, transparent);background:var(--high-soft)}
.snooze-banner.expired > svg{color:var(--high)}
.skel{display:block;border-radius:4px;background:linear-gradient(90deg, var(--surface-3) 0%, color-mix(in oklch, var(--surface-3) 55%, var(--surface)) 50%, var(--surface-3) 100%);background-size:200% 100%;animation:shimmer 1.3s ease-in-out infinite;max-width:100%}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.scanbar{display:flex;flex-direction:column;gap:8px;padding:10px 14px;margin-bottom:14px;border:1px solid color-mix(in oklch, var(--accent) 25%, transparent);background:var(--accent-soft);border-radius:var(--radius-lg);font-size:var(--text-sm);color:var(--fg-2)}
.scanbar svg{color:var(--accent-ink)}
.scanbar-track{display:block;height:3px;border-radius:2px;background:color-mix(in oklch, var(--accent) 18%, transparent);overflow:hidden}
.scanbar-track span{display:block;height:100%;background:var(--accent);transition:width .35s cubic-bezier(.22,1,.36,1)}
.sieve.scanning .n{color:transparent!important;background:linear-gradient(90deg, var(--surface-3), color-mix(in oklch, var(--surface-3) 55%, var(--surface)), var(--surface-3));background-size:200% 100%;animation:shimmer 1.3s ease-in-out infinite;border-radius:4px;width:fit-content}
td.cb,th.cb{width:36px;padding-right:0}
.check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0;vertical-align:middle}
.tbl tbody tr.selected td{background:color-mix(in oklch, var(--accent-soft) 70%, var(--surface))}
.bulkbar{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;margin-top:12px;display:flex;flex-direction:column;gap:12px;padding:12px 14px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--border-strong);box-shadow:var(--shadow-pop)}
.bulkform{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.name-why{display:flex;flex-direction:column;gap:10px;max-width:70ch}
.name-why .nm{display:flex;align-items:baseline;gap:10px}
.name-why .nm b{font-size:var(--text-xl);font-weight:600;letter-spacing:-0.02em}
.name-why .nm span{color:var(--muted)}
.name-why p{color:var(--fg-2)}
.sevrow{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:12px;align-items:center;font-size:var(--text-sm)}
.sevrow .num{text-align:right}
.sevtrack{display:block;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.sevtrack span{display:block;height:100%;border-radius:3px}
.applink{color:var(--fg)}
.applink:hover{color:var(--accent-ink)}
@media (max-width: 1100px) and (min-width: 761px){
  .hide-md{display:none!important}
}
/* narrow tablet: icon rail */
@media (max-width: 1024px) and (min-width: 761px){
  :root{--rail-w:60px}
  .rail{padding-left:max(8px, env(safe-area-inset-left,0px));padding-right:8px;align-items:stretch}
  .rail .lbl{display:none!important}
  .brand{justify-content:center;padding:4px 0 14px}
  .nav a{justify-content:center;padding:9px 0;position:relative}
  .nav a .count{position:absolute;top:2px;right:4px;margin:0;font-size:10px}
  .nav a .count:not(.hot){display:none}
  .nav-label{height:14px;padding:0;margin:6px 8px;border-top:1px solid var(--border)}
  .rail-foot{align-items:center;padding:10px 0 0}
  .scanline{padding:0;justify-content:center}
  .rail-links a{justify-content:center;padding:6px}
}
@media (prefers-reduced-motion: reduce){ .skel,.sieve.scanning .n{animation:none} }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

    if (s.k === "ci" && r.ci === "failed") detail = "2 tests failed in checkout.spec.ts. The agent stopped, a person needs to look.";
    if (s.k === "ci" && i === idx && !r.ci) detail = "lint, typecheck, test, build";
    if (s.k === "merged" && i === idx) detail = "Merged. Waiting for Coolify to pick up the new commit on " + (dep(f.apps[0]).branch);
    if (s.k === "deployed" && i === idx) detail = "Coolify deployment finished. Rescanning the running image.";
    if (s.k === "verified" && i === idx) detail = `${f.pkg}@${f.fix} confirmed in the running image of ${f.apps.join(", ")}. Alert closed on GitHub.`;
    if (i < idx || cls === "done") right = s.k === "queued" ? (r.started || "just now") : "";
    let extra = "";
    if (s.k === "running" && i === idx) extra = `<div class="log" id="runlog">${r.log.join("\n")}</div>`;
    if (s.k === "ci" && i === idx && r.ci === "passed") extra = `<div class="checks">${["lint", "typecheck", "test", "build"].map(c => `<div>${ic("circle-check", "sm")}<span class="mono">${c}</span></div>`).join("")}</div>`;
    if (s.k === "ci" && i === idx && r.ci === "failed") extra = `<div class="row" style="margin-top:8px"><a class="btn sm" href="#" onclick="return false">${ic("external-link", "sm")}Open PR</a><button class="btn sm" data-retry="${f.id}">${ic("refresh", "sm")}Retry agent</button></div>`;
    return `<li class="step ${cls}"><span class="dot">${icon === "point" ? `<span style="width:8px;height:8px;border-radius:50%;background:currentColor"></span>` : icon ? ic(icon, "sm " + (icon === "loader-2" ? "spin" : "")) : ""}</span><div><div class="st-t">${s.t}</div><div class="st-d">${detail}</div>${extra}</div><span class="st-r">${right}</span></li>`;
  }).join("");

  const nextLabel = !r.at ? "" : { queued: "Start agent", running: "Finish agent run", pr: "Start CI", ci: r.ci ? (r.ci === "passed" ? "Merge on GitHub" : "") : "Pass CI", merged: "Coolify deploys", deployed: "Rescan" }[r.at] || "";
  const fixPanel = `
  <section class="panel" id="fix">
    <div class="panel-h">${ic("robot")}<h2>Fix agent</h2>
      <span style="margin-left:auto">${stateHtml(f)}</span></div>
    <div class="panel-b">
      ${!r.at ? `<div class="stack">
          <p class="fg2" style="max-width:62ch">The agent clones <span class="code-inline">${ORG}/${f.repoFor}</span>, bumps <span class="code-inline">${f.pkg}</span> from ${f.ver} to ${f.fix} (patch release, same minor line), updates the lockfile, runs your tests and opens a pull request. It never merges. You review and merge on GitHub.</p>
          <div class="row"><button class="btn primary" data-run="${f.id}">${ic("player-play", "sm")}Run fix agent<span class="kbd">F</span></button><span class="muted" style="font-size:var(--text-xs)">Branch <span class="mono">hinomi/${f.pkg}-${f.fix}</span></span></div>
        </div>` : `<ol class="steps">${steps}</ol>
        ${nextLabel ? `<div class="proto">${ic("sparkles", "sm")}Prototype only:<button class="btn sm" data-advance="${f.id}">${nextLabel}</button>${r.at === "ci" && !r.ci ? `<button class="btn sm" data-failci="${f.id}">Fail CI</button>` : ""}</div>` : ""}`}
    </div>
  </section>`;

  const snoozeForm = `
  <form class="panel" id="snoozeform" ${S.snoozeOpen ? "" : "hidden"}>
    <div class="panel-h">${ic("clock-pause")}<h2>Snooze or accept risk</h2></div>
    <div class="panel-b stack">
      <div class="field"><span class="label">Decision</span>
        <div class="seg" role="radiogroup" aria-label="Decision"><button type="button" role="radio" aria-pressed="true" data-kind="Snoozed">Snooze</button><button type="button" role="radio" aria-pressed="false" data-kind="Accepted risk">Accept risk</button></div>
        <span class="help">Snooze when a fix is planned. Accept risk when you decided not to fix. Both stay visible.</span></div>
      <div class="field"><label for="sn-reason">Reason</label><textarea class="input" id="sn-reason" placeholder="Why is this safe enough for now?"></textarea><span class="err" id="sn-err" hidden>${ic("alert-circle", "sm")}Add a reason so the next person knows why.</span></div>
      <div class="field"><label for="sn-until">Expires</label><select class="select" id="sn-until"><option>In 7 days</option><option selected>In 30 days</option><option>In 90 days</option><option>When a new advisory affects this package</option></select><span class="help">After it expires the finding returns to the top and alerts again.</span></div>
      <div class="row"><button class="btn primary" type="submit">Save decision</button><button class="btn ghost" type="button" data-action="snooze-cancel">Cancel</button></div>
    </div>
  </form>`;

  const actions = `${!r.at && !accepted ? `<button class="btn primary lg" data-run="${f.id}">${ic("robot", "sm")}Run fix agent</button>` : r.pr ? `<a class="btn lg" href="#" onclick="return false">${ic("git-pull-request", "sm")}View PR #${r.pr} on GitHub</a>` : ""}
        <button class="btn" data-action="snooze-open">${ic("clock-pause", "sm")}Snooze or accept risk<span class="kbd">S</span></button>
        <a class="btn ghost" href="#" onclick="return false">${ic("external-link", "sm")}Open advisory on GitHub</a>`;
  const body = `
  <div class="fd-head">
    <div class="ids">${sevBadge(f.sev)}<span class="badge outline mono">CVSS ${f.cvss}</span><span class="mono">${f.ghsa}</span><span class="mono">${f.cve}</span><span>${f.ecosystem}</span>${srcBadge(f.src)}</div>
    <h1>${esc(f.title)}</h1>
    <div class="row muted" style="font-size:var(--text-sm);gap:6px 16px">
      <span><span class="mono" style="color:var(--fg)">${f.pkg}@${f.ver}</span> → patched in <span class="mono" style="color:var(--ok)">${f.fix}</span></span>
      <span>Published ${f.published}</span><span>First seen here ${f.seen}</span>
    </div>
  </div>
  ${f.expired && !accepted && !r.at ? `<div class="snooze-banner expired" style="margin-bottom:20px">${ic("clock-exclamation")}<div class="stack" style="gap:4px"><b>Snooze expired ${f.expired.when}</b><span class="fg2">Your reason was: "${esc(f.expired.reason)}" The patched release ${f.fix} is out now, so it is back at the top.</span></div></div>` : ""}
  ${accepted ? `<div class="snooze-banner" style="margin-bottom:20px">${ic("clock-pause")}<div class="stack" style="gap:4px"><b>${f.accept.kind} by ${f.accept.by}, until ${f.accept.until}</b><span class="fg2">${esc(f.accept.reason)}</span><span class="row"><button class="btn sm" data-unaccept="${f.id}">Remove decision</button><button class="btn sm ghost" data-run="${f.id}">${ic("robot", "sm")}Run fix agent anyway</button></span></div></div>` : ""}
  <div class="fd-grid">
    <div class="stack" style="gap:24px">
      <div class="panel panel-b stack show-sm">${actions}</div>
      <section class="section">
        <div class="section-h"><h2>Why this ranks at the top</h2>${factors({ s: 1, r: 1, d: 1, p: 1 }, true)}</div>
        <div class="why">
          <div><span class="k">${ic(SEV[f.sev].icon, "sm")}Severity</span><span class="v">${SEV[f.sev].label}, CVSS ${f.cvss}</span><span class="s">Attack vector: network</span></div>
          <div><span class="k">${ic("package", "sm")}Runtime</span><span class="v">In dependencies</span><span class="s">${f.path.length > 2 ? "Transitive via " + f.path[1] : "Direct dependency"}</span></div>
          <div><span class="k">${ic("server-2", "sm")}Deployed</span><span class="v">${apps.length} running app${apps.length > 1 ? "s" : ""}</span><span class="s">${apps.map(a => a.server).join(", ")}</span></div>
          <div><span class="k">${ic("world", "sm")}Public</span><span class="v">${apps[0].domains[0]}</span><span class="s">${apps.flatMap(a => a.domains).length} public domain${apps.flatMap(a => a.domains).length > 1 ? "s" : ""}</span></div>
        </div>
      </section>
      ${fixPanel}
      ${snoozeForm}
      <section class="section">
        <h2>Affected deployments</h2>
        <div class="panel panel-b affected">
          ${apps.map(a => `<a href="#deployment-${a.id}"><span class="app-cell"><b>${a.id}</b><small>${a.domains.join(", ")} on ${a.server}. Image <span class="mono">${a.image}</span>, deployed ${a.deployed}</small></span>${a.ghOff ? `<span class="badge warn">${ic("eye-off")}Alerts off, via OSV</span>` : `<span class="badge accent">${ic("world")}Public</span>`}</a>`).join("")}
        </div>
      </section>
      <section class="section">
        <h2>Advisory</h2>
        <div class="prose">
          <p>${esc(f.desc)}</p>
          <p>Vulnerable range <code>${esc(f.range)}</code>. First patched version <code>${f.fix}</code>. No workaround is published.</p>
        </div>
        <div class="depgraph">${f.path.map((p, i) => (i ? "  ".repeat(i - 1) + "└─ " : "") + (i === f.path.length - 1 ? `<b>${p}</b>` : p)).join("\n")}</div>
      </section>
      <section class="section">
        <h2>Decisions and history</h2>
        ${histHtml(f.hist)}
      </section>
    </div>
    <div class="aside">
      <div class="panel panel-b stack hide-sm">${actions}</div>
      
      <div class="panel">
        <div class="panel-h"><h2>Details</h2></div>

          <dt>Repo</dt><dd class="mono">${ORG}/${f.repoFor}</dd>
          <dt>Manifest</dt><dd class="mono">package.json</dd>

          <dt>Alerts grouped</dt><dd>${f.id === "F1" ? "6 (2 repos)" : "1"}</dd>
          <dt>Published</dt><dd>${f.published}</dd>
          <dt>First seen</dt><dd>${f.seen}</dd>
        </dl></div>
      </div>
      <div class="panel">

        <div class="panel-b feed"><ul>
          <li>${ic("brand-discord", "sm")}<div>Discord #ops<time>${f.seen}</time></div></li>
          <li>${ic("mail", "sm")}<div>Daily digest, ops@example.dev<time>Included in today's digest</time></div></li>
        </ul></div>
      </div>
    </div>
  </div>`;
  return shell("finding-" + id, crumb(`<a href="#exposure">Exposure</a>`, f.pkg), body);
}


function sevCounts(c) {
  const parts = !c ? [] : ["critical", "high", "moderate", "low"].filter(k => c[k]).map(k => `<span class="c sev-${k}" title="${c[k]} ${k}">${ic(SEV[k].icon, "sm")}${c[k]}</span>`);
  return parts.length ? `<span class="sevcount">${parts.join("")}</span>` : `<span class="muted">${c === null ? "Unknown" : "None open"}</span>`;
}

/* ---------- all alerts ---------- */
function alertPasses(a) {
  const F = S.filt;
  if (!F.sev[a.sev]) return false;
  if (F.scope === "deployed" && !a.app) return false;
  if (F.scope === "not" && a.app) return false;
  if (F.dep === "runtime" && !a.runtime) return false;
  if (F.dep === "dev" && a.runtime) return false;
  if (F.st !== "all" && a.st !== F.st) return false;
  if (F.src && F.src !== "all" && a.src !== F.src) return false;
  if (F.q && !(a.pkg + " " + a.repo + " " + a.sum).toLowerCase().includes(F.q.toLowerCase())) return false;
  return true;
}
const ALL_ROWS = () => TIERS.flatMap(t => t.rows);

function alertTr(a) {

  return `<tr class="click data ${checked ? "selected" : ""}" data-row data-sel-row="${a.id}" tabindex="-1">

      <td class="hide-card"><span class="mono">${a.repo}</span>${a.app ? `<br><small class="muted">${a.app}</small>` : ""}</td>

function maxStep() { const o = S.ob; return o.coolify !== "ok" ? 1 : o.github !== "ok" ? 2 : 4; }

    <div class="section-h"><h2>Type, radius, spacing</h2><p>One family for UI (Geist) plus Geist Mono for package names, versions, hashes and IDs. Ratio about 1.2, fixed rem.</p></div>
    <div class="typescale">
      <div><small>xl 26/32 600</small><span style="font-size:var(--text-xl);font-weight:600;letter-spacing:-0.012em">5 findings are exposed right now</span></div>
      <div><small>lg 20/28 600</small><span style="font-size:var(--text-lg);font-weight:600">Remote code execution through crafted payloads</span></div>
      <div><small>md 16/24 600</small><span style="font-size:var(--text-md);font-weight:600">Exposed findings</span></div>
      <div><small>base 14/22 400</small><span>Critical or high severity, in runtime code, on an app with a public domain.</span></div>
      <div><small>sm 13/20 500</small><span style="font-size:var(--text-sm);font-weight:500">Run fix agent</span></div>
      <div><small>xs 12/16 400</small><span style="font-size:var(--text-xs);color:var(--muted)">Published 2 days ago</span></div>
      <div><small>mono 12.5</small><span class="mono">tessera 14.2.3 → 14.2.9</span></div>
    </div>
    <div class="row" style="gap:16px;font-size:var(--text-xs);color:var(--muted)">
      <span class="row" style="gap:6px"><span style="width:28px;height:28px;border:1px solid var(--border-strong);border-radius:4px;display:inline-block"></span>sm 4px: badges, kbd</span>
      <span class="row" style="gap:6px"><span style="width:28px;height:28px;border:1px solid var(--border-strong);border-radius:6px;display:inline-block"></span>md 6px: buttons, inputs</span>
      <span class="row" style="gap:6px"><span style="width:28px;height:28px;border:1px solid var(--border-strong);border-radius:10px;display:inline-block"></span>lg 10px: panels, tables</span>
      <span>Pills (999px) only for filter chips and toggles.</span>
      <span>Spacing: 4px grid. Row padding 14/16, panel padding 16, section gap 28 to 32.</span>
    </div>
  </section>
  <section class="section">
    <div class="section-h"><h2>Tailwind v4 theme</h2><p>Drop-in for a shadcn/ui project. Severity and success are extra tokens; everything else uses shadcn names.</p></div>
    <div class="codeblock"><button class="btn sm" data-action="copy-theme">${ic("copy", "sm")}Copy</button><pre id="themecss">${esc(themeCss())}</pre></div>
  </section>`;
  return shell("design-notes", crumb("Name and tokens"), body);
}

/* ---------- router ---------- */
const ROUTES = { exposure: viewExposure, deployments: viewDeployments, alerts: viewAlerts, fixes: viewFixes, drift: viewDrift, configure: viewConfigure, welcome: viewWelcome, "design-notes": viewDesignNotes };
function route() { return (location.hash || "#exposure").slice(1) || "exposure"; }
let lastRoute = null;
function render(keepScroll) {
  const r = route();
  S.firstRun = r === "welcome";
  let html;
  if (r.startsWith("finding-")) html = viewFinding(r.slice(8));
  else if (r.startsWith("deployment-")) html = viewDeployment(r.slice(11));
  else if (r.startsWith("blind-")) html = viewBlind(r.slice(6));
  else html = (ROUTES[r] || viewExposure)();
  const y = window.scrollY;
  const active = document.activeElement && document.activeElement.id;
  $("#root").innerHTML = html;
  if (r !== lastRoute) { window.scrollTo(0, 0); S.kb = -1; } else if (keepScroll !== false) { window.scrollTo(0, y); }
  if (active && document.getElementById(active) && keepScroll !== false && r === lastRoute) { const el = document.getElementById(active); el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); }
  lastRoute = r;
  $$("[data-indeterminate]").forEach(el => el.indeterminate = true);
  paintKb();
  document.title = "Hinomi Exposure Watch";
}
window.addEventListener("hashchange", () => { S.snoozeOpen = false; S.bulk = null; render(); });
function runScan() {
  if (S.scan.on) return;
  S.scan = { on: true, n: 0 };   const tick = () => { S.scan.n = Math.min(38, S.scan.n + 3 + Math.floor(Math.random() * 3)); if (S.scan.n >= 38) { S.scan = { on: false, n: 0 }; render(); toast("Scan finished. No new exposed findings or blind spots.", "radar-2"); return; } render(); setTimeout(tick, 380); };
  setTimeout(tick, 380);
}

/* ---------- fix agent simulation ---------- */
const timers = {};
function startRun(id) {
  const r = runs[id]; const f = finding(id);
  if (f.state === "accepted") f.state = "new";
  r.at = "queued"; r.ci = null; r.pr = null; r.started = "just now"; r.log = [];
  f.hist.push(["robot", "Fix agent started by you", "Just now"]);
  toast(`Fix agent queued for ${f.pkg}`, "robot");
  render();
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => { r.at = "running"; render(); streamLog(id); }, 1400);
}
function streamLog(id) {
  const r = runs[id], f = finding(id);
  const lines = [
    `Cloned ${ORG}/${f.repoFor} at main`,
    `Found ${f.pkg}@${f.ver} in package.json (dependencies)`,
    `Patched version ${f.fix} is within the same minor line`,
    `pnpm up ${f.pkg}@${f.fix} <span class='ok'>done</span>`,
    `Running unit tests (pnpm test) <span class='ok'>148 passed</span>`,
    `Pushed branch hinomi/${f.pkg}-${f.fix}`
  ];
  let i = 0;
  const tick = () => {
    if (r.at !== "running") return;
    const t = new Date(); const ts = t.toTimeString().slice(0, 8);
    r.log.push(`<span class='dim'>${ts}</span> ${lines[i]}`); i++;
    const box = $("#runlog");
    if (box && route() === "finding-" + id) { box.innerHTML = r.log.join("\n"); box.scrollTop = box.scrollHeight; } else if (route() !== "finding-" + id) {}
    if (i < lines.length) timers[id] = setTimeout(tick, 700);
    else timers[id] = setTimeout(() => { r.at = "pr"; r.pr = 300 + Math.floor(Math.random() * 200); toast(`PR #${r.pr} opened in ${f.repoFor}`, "git-pull-request"); render(); timers[id] = setTimeout(() => { r.at = "ci"; render(); timers[id] = setTimeout(() => { if (r.at === "ci" && !r.ci) { r.ci = "passed"; render(); } }, 2600); }, 1200); }, 600);
  };
  tick();
}
function advance(id) {
  const r = runs[id], f = finding(id);
  clearTimeout(timers[id]);
  if (r.at === "queued") { r.at = "running"; render(); streamLog(id); return; }
  if (r.at === "running") { r.log.push("<span class='dim'>agent</span> done"); r.at = "pr"; r.pr = r.pr || 412; }
  else if (r.at === "pr") { r.at = "ci"; r.ci = null; }
  else if (r.at === "ci" && !r.ci) r.ci = "passed";
  else if (r.at === "ci" && r.ci === "passed") { r.at = "merged"; f.hist.push(["git-merge", `PR #${r.pr} merged on GitHub`, "Just now"]); toast(`PR #${r.pr} merged`, "git-merge"); }
  else if (r.at === "merged") { r.at = "deployed"; f.hist.push(["rocket", `Coolify deployed ${f.apps.join(", ")}`, "Just now"]); toast(`Coolify deployed ${f.apps[0]}`, "rocket"); }
  else if (r.at === "deployed") { r.at = "verified"; f.expired = null; f.hist.push(["shield-check", `Verified fixed: ${f.pkg}@${f.fix} running`, "Just now"]); toast(`${f.pkg} verified fixed`, "shield-check"); }
  render();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a, input[data-sel], input[data-sel-group], [data-row], [data-expand]");
  if (!t) return;
  const d = t.dataset;
  if (d.themeSet) { S.theme = d.themeSet; store.set("theme", S.theme); applyTheme(); render(); return; }
  if (d.action === "theme-cycle") { const order = ["system", "light", "dark"]; S.theme = order[(order.indexOf(S.theme) + 1) % 3]; store.set("theme", S.theme); applyTheme(); render(); toast(`Theme: ${S.theme}`, S.theme === "dark" ? "moon" : S.theme === "light" ? "sun" : "device-desktop"); return; }
  if (d.action === "shortcuts") { e.preventDefault(); shortcuts(); return; }
  if (d.action === "scan") { runScan(); return; }
  if (d.group) { S.group = d.group; render(); return; }
  if (d.selGroup) { const ids = d.selGroup.split(","); const all = ids.every(id => S.sel.has(id)); ids.forEach(id => all ? S.sel.delete(id) : S.sel.add(id)); render(); return; }
  if (d.sel) { S.sel.has(d.sel) ? S.sel.delete(d.sel) : S.sel.add(d.sel); render(); return; }
  if (d.selRow && !e.target.closest("a")) { S.sel.has(d.selRow) ? S.sel.delete(d.selRow) : S.sel.add(d.selRow); render(); return; }
  if (d.bulk) { S.bulk = d.bulk; render(); setTimeout(() => $("#bk-reason")?.focus(), 20); return; }
  if (d.action === "bulk-cancel") { S.bulk = null; render(); return; }
  if (d.action === "sel-clear") { S.sel.clear(); S.bulk = null; render(); return; }
  if (d.action === "blind-intent") { toast("Recorded as intentional. It stays listed as a blind spot with your note.", "clock-pause"); return; }
  if (d.repoFilter) { S.filt.q = d.repoFilter; S.group = "tier"; return; }
  if (d.run) { e.preventDefault(); e.stopPropagation(); startRun(d.run); return; }
  if (d.advance) { advance(d.advance); return; }
  if (d.failci) { runs[d.failci].ci = "failed"; clearTimeout(timers[d.failci]); render(); return; }
  if (d.retry) { startRun(d.retry); return; }
  if (d.unaccept) { const f = finding(d.unaccept); f.state = "new"; f.hist.push(["history", `${f.accept.kind} removed by you`, "Just now"]); toast("Decision removed. The finding is back at the top.", "history"); render(); return; }
  if (d.action === "snooze-open") { S.snoozeOpen = true; render(); setTimeout(() => { const el = $("#sn-reason"); if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.focus(); } }, 30); return; }
  if (d.action === "snooze-cancel") { S.snoozeOpen = false; render(); return; }
  if (d.kind) { $$("[data-kind]").forEach(b => b.setAttribute("aria-pressed", b === t)); return; }
  if (d.sev) { S.filt.sev[d.sev] = !S.filt.sev[d.sev]; render(); return; }
  if (d.action === "clear-filters") { S.filt = { sev: { critical: true, high: true, moderate: true, low: true }, scope: "all", dep: "all", st: "all", src: "all", q: "" }; render(); return; }
  if (d.more) { S.shown[d.more] += 25; render(); return; }
  if (d.tierJump) { setTimeout(() => { const el = document.getElementById("tier-" + d.tierJump); if (el) el.scrollIntoView({ block: "start" }); }, 30); return; }
  if (t.classList.contains("toggle")) { t.setAttribute("aria-checked", t.getAttribute("aria-checked") !== "true"); return; }
  if (d.action === "test") { toast("Coolify reachable. 12 apps found.", "plug-connected"); return; }
  if (d.action === "test-notify") { toast("Test alert sent to Discord #ops", "brand-discord"); return; }
  if (d.action === "map-save") { toast("Mapping saved. Rescan to see findings for image-proxy.", "check"); return; }
  if (d.action === "copy-theme") { const txt = themeCss(); const done = () => toast("Theme CSS copied", "copy"); try { navigator.clipboard.writeText(txt).then(done, () => { selectPre(); toast("Copy blocked here. The CSS is selected, press Cmd+C.", "copy"); }); } catch { selectPre(); } return; }
  if (d.jump) { e.preventDefault(); document.getElementById(d.jump).scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (d.gmode) { S.ob.gmode = d.gmode; render(); return; }
  if (d.ob) { const n = +d.ob; if (n <= maxStep()) { S.ob.step = n; render(); } return; }
  if (d.obTest) { const k = d.obTest; S.ob[k] = "busy"; render(); setTimeout(() => { S.ob[k] = "ok"; render(); }, 1300); return; }
  if (d.obNext) { S.ob.step = +d.obNext; render(); return; }
  if ("obNotify" in d) { S.ob.notify = true; S.ob.step = 4; render(); return; }
  if ("obScan" in d) { S.ob.scan = "busy"; S.ob.scanLines = 0; render(); const step = () => { S.ob.scanLines++; if (S.ob.scanLines >= 4) { S.ob.scan = "done"; } render(); if (S.ob.scan === "busy") setTimeout(step, 800); }; setTimeout(step, 800); return; }
  if ("obFinish" in d) { e.preventDefault(); S.ob = { step: 1, coolify: "idle", github: "idle", gmode: "token", scan: "idle", scanLines: 0, notify: false }; location.hash = "#exposure"; return; }
  if (d.expand && t.tagName !== "BUTTON") { e.preventDefault(); if (route() !== "deployments") { S.expanded = d.expand; location.hash = "#deployments"; return; } S.expanded = S.expanded === d.expand ? null : d.expand; render(); return; }
  if (d.href && t.tagName !== "A") { if (e.target.closest("a,button")) return; location.hash = d.href; return; }
});
function selectPre() { const r = document.createRange(); r.selectNodeContents($("#themecss")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
document.addEventListener("change", e => { const f = e.target.dataset.filt; if (f) { S.filt[f] = e.target.value; render(); } });
document.addEventListener("input", e => { if (e.target.id === "q") { S.filt.q = e.target.value; render(); } if (e.target.id === "sn-reason") { $("#sn-err").hidden = true; e.target.removeAttribute("aria-invalid"); } });
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "bulkform") {
    const reason = $("#bk-reason").value.trim();
    if (!reason) { $("#bk-err").hidden = false; $("#bk-reason").setAttribute("aria-invalid", "true"); $("#bk-reason").setAttribute("aria-describedby", "bk-err"); $("#bk-reason").focus(); return; }
    const until = { "In 7 days": "13 Nov", "In 30 days": "6 Dec", "In 90 days": "4 Feb" }[$("#bk-until").value];
    const n = S.sel.size, kind = S.bulk;
    ALL_ROWS().forEach(a => { if (S.sel.has(a.id)) { a.st = "snoozed"; a.kind = kind; a.until = until; a.reason = reason; } });
    S.sel.clear(); S.bulk = null; render();
    toast(`${n} alert${n > 1 ? "s" : ""} ${kind === "Snoozed" ? "snoozed" : "accepted"} until ${until}. Still listed.`, "clock-pause");
    return;
  }
  if (e.target.id === "snoozeform") {
    const reason = $("#sn-reason").value.trim();
    if (!reason) { $("#sn-err").hidden = false; $("#sn-reason").setAttribute("aria-invalid", "true"); $("#sn-reason").setAttribute("aria-describedby", "sn-err"); $("#sn-reason").focus(); return; }
    const id = route().slice(8), f = finding(id);
    const kind = ($("[data-kind][aria-pressed='true']") || {}).dataset?.kind || "Snoozed";
    const until = $("#sn-until").value.replace("In ", "for ");
    f.state = "accepted"; runs[id].at = null; runs[id].pr = null; f.expired = null;
    f.hist.push(["clock-pause", `${kind} by you ${until.startsWith("for") ? until : "until a new advisory"}: "${reason}"`, "Just now"]);
    f.accept = { kind, by: "you", until: until.startsWith("for") ? (until === "for 7 days" ? "13 Nov 2026" : until === "for 30 days" ? "6 Dec 2026" : "4 Feb 2027") : "a new advisory", reason };
    S.snoozeOpen = false; toast(`${kind}. It stays listed with your reason.`, "clock-pause"); render();
  }
});

/* ---------- keyboard ---------- */
function rows() { return $$("[data-list] [data-row]"); }
function paintKb() { const rs = rows(); rs.forEach((r, i) => r.classList.toggle("kb", i === S.kb)); }
function shortcuts() {
  if ($(".sheet-back")) { $(".sheet-back").remove(); return; }
  const k = [["Move down, up", "j  k"], ["Open selected", "Enter"], ["Go to exposure", "g e"], ["Go to deployments", "g d"], ["Go to all alerts", "g a"], ["Go to fix runs", "g f"], ["Go to settings", "g s"], ["Search alerts", "/"], ["Run fix agent (finding)", "f"], ["Snooze or accept (finding)", "s"], ["Select row (alerts)", "x"], ["Switch theme", "t"], ["Show this list", "?"]];
  const el = document.createElement("div"); el.className = "sheet-back";
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="kbh"><div class="panel-h"><h2 id="kbh">Keyboard shortcuts</h2><button class="btn ghost sm" style="margin-left:auto" aria-label="Close" data-close>${ic("x", "sm")}</button></div><div class="panel-b">${k.map(x => `<span>${x[0]}</span><span>${x[1].split(/\s\s|\s/).map(p => `<span class="kbd">${p}</span>`).join(" ")}</span>`).join("")}</div></div>`;
  el.addEventListener("click", ev => { if (ev.target === el || ev.target.closest("[data-close]")) el.remove(); });
  document.body.appendChild(el); el.querySelector("[data-close]").focus();
}
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === "Escape") { const sh = $(".sheet-back"); if (sh) { sh.remove(); return; } if (typing) document.activeElement.blur(); if (S.snoozeOpen) { S.snoozeOpen = false; render(); } else if (S.bulk) { S.bulk = null; render(); } else if (S.sel.size && !typing) { S.sel.clear(); render(); } return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const r = route();
  if (S.gPressed) { S.gPressed = false; const m = { e: "exposure", d: "deployments", a: "alerts", f: "fixes", s: "configure" }[e.key]; if (m) { location.hash = "#" + m; e.preventDefault(); } return; }
  if (e.key === "g") { S.gPressed = true; setTimeout(() => S.gPressed = false, 900); return; }
  if (e.key === "?") { shortcuts(); return; }
  if (e.key === "t") { const order = ["system", "light", "dark"]; S.theme = order[(order.indexOf(S.theme) + 1) % 3]; store.set("theme", S.theme); applyTheme(); render(); toast(`Theme: ${S.theme}`, S.theme === "dark" ? "moon" : S.theme === "light" ? "sun" : "device-desktop"); return; }
  if (e.key === "/") { const q = $("#q"); if (q) { e.preventDefault(); q.focus(); } else { location.hash = "#alerts"; setTimeout(() => $("#q")?.focus(), 50); e.preventDefault(); } return; }
  if (e.key === "j" || e.key === "k") { const rs = rows(); if (!rs.length) return; S.kb = Math.max(0, Math.min(rs.length - 1, S.kb + (e.key === "j" ? 1 : -1))); paintKb(); rs[S.kb].scrollIntoView({ block: "nearest" }); return; }
  if (e.key === "x" && S.kb >= 0) { const rw = rows()[S.kb]; if (rw && rw.dataset.selRow) { const id = rw.dataset.selRow; S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); render(); } return; }
  if (e.key === "Enter" && S.kb >= 0) { const rw = rows()[S.kb]; if (rw) { if (rw.dataset.href) location.hash = rw.dataset.href; else rw.click(); } return; }
  if (r.startsWith("finding-")) {
    const id = r.slice(8);
    if (e.key === "f" && !runs[id].at) startRun(id);
    if (e.key === "s") $("[data-action='snooze-open']")?.click();
  }
});


render();
setTimeout(() => { S.booting = false; render(); }, 900);
</script>
